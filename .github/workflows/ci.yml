name: CI & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-android:
    name: Test Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: apps/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --no-daemon

  test-daemon:
    name: Test DevLens Daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Daemon syntax and endpoints
        run: |
          python3 -m py_compile apps/daemon/server.py
          python3 apps/daemon/server.py --port 8899 --token testtoken &
          DAEMON_PID=$!
          sleep 2
          curl -s -f http://127.0.0.1:8899/health -H "X-Mesh-Token: testtoken"
          kill $DAEMON_PID
