name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: apps/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-assets
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk release-assets/DevLens.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/DevLens.apk

  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: devlens-linux-x64
            target_file: apps/desktop/target/release/devlens-desktop
          - os: macos-latest
            artifact_name: devlens-macos-arm64
            target_file: apps/desktop/target/release/devlens-desktop
          - os: windows-latest
            artifact_name: devlens-windows-x64.exe
            target_file: apps/desktop/target/release/devlens-desktop.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Build release binary
        working-directory: apps/desktop
        run: cargo build --release

      - name: Codesign macOS binary
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        run: codesign --force --sign - -r='designated => identifier "com.devlens.desktop"' --entitlements assets/DevLens.entitlements target/release/devlens-desktop

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.target_file }}

      - name: Build macOS App Bundle and DMG
        if: matrix.os == 'macos-latest'
        run: |
          APP_NAME="DevLens.app"
          rm -rf staging_dmg "$APP_NAME"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          cp apps/desktop/target/release/devlens-desktop "$APP_NAME/Contents/MacOS/DevLens"
          chmod +x "$APP_NAME/Contents/MacOS/DevLens"
          cp apps/desktop/assets/Info.plist "$APP_NAME/Contents/Info.plist"
          cp apps/desktop/assets/AppIcon.icns "$APP_NAME/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - -r='designated => identifier "com.devlens.desktop"' --entitlements apps/desktop/assets/DevLens.entitlements "$APP_NAME"

          mkdir -p staging_dmg
          cp -R "$APP_NAME" staging_dmg/
          ln -s /Applications staging_dmg/Applications
          hdiutil create -volname "DevLens" -srcfolder staging_dmg -ov -format UDZO apps/desktop/target/release/DevLens.dmg

      - name: Upload macOS DMG artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: apps/desktop/target/release/DevLens.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets

      - name: Flatten and Package Assets
        run: |
          mkdir -p release-files
          # Android APK
          cp all-assets/android-apk/*.apk release-files/DevLens.apk

          # Windows Direct EXE
          cp all-assets/devlens-windows-x64.exe/devlens-desktop.exe release-files/DevLens-Windows.exe

          # macOS DMG Installer
          cp all-assets/macos-dmg/DevLens.dmg release-files/DevLens.dmg

          # macOS Direct Binary
          chmod +x all-assets/devlens-macos-arm64/devlens-desktop
          cp all-assets/devlens-macos-arm64/devlens-desktop release-files/DevLens-macOS

          # Linux Direct Binary
          chmod +x all-assets/devlens-linux-x64/devlens-desktop
          cp all-assets/devlens-linux-x64/devlens-desktop release-files/DevLens-Linux

          # Generate update manifests
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          python3 -c "import json; v='$VERSION'; t='$TAG'; r='$REPO'; b=f'https://github.com/{r}/releases/download/{t}'; json.dump({'version': v, 'apkUrl': f'{b}/DevLens.apk', 'windowsUrl': f'{b}/DevLens-Windows.exe', 'macosUrl': f'{b}/DevLens.dmg', 'macosBinaryUrl': f'{b}/DevLens-macOS', 'linuxUrl': f'{b}/DevLens-Linux', 'notes': f'Wydanie {t}: DevLens - zdalny eksplorator plików, audytor bezpieczeństwa węzłów oraz czytnik kodu.'}, open('release-files/android-latest.json', 'w'), indent=2)"
          cp release-files/android-latest.json release-files/latest.json

          ls -la release-files/

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: DevLens ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
